[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "codonflow"
version = "0.1.0"
description = "Finite-step synonymous CDS editing with budget-matched learned and simple-search evaluation"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4",
    "numpy",
    "scipy",
]

[project.optional-dependencies]
dev = ["pytest", "pandas>=2.2", "scikit-learn>=1.7"]
eval = ["pymoo", "ViennaRNA", "rapidfuzz"]
analysis = ["pandas>=2.2", "scikit-learn>=1.7", "xlrd>=2.0,<3"]
baselines = ["transformers", "linformer"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: isolated integration test that may require local system tools",
]
